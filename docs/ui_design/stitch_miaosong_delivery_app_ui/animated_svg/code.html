<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_35 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_35" style="display:block;"><svg height="100%" viewbox="0 0 512 512" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Background Gradient -->
<lineargradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#FF6B00"></stop>
<stop offset="100%" stop-color="#FF3800"></stop>
</lineargradient>
<!-- Speed Teal Gradient for Collar and Visor -->
<lineargradient id="tealGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#00E5C9"></stop>
<stop offset="100%" stop-color="#00B49F"></stop>
</lineargradient>
<!-- Body & Paw Gradient -->
<lineargradient id="furGrad" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#FFFFFF"></stop>
<stop offset="100%" stop-color="#F4F5FA"></stop>
</lineargradient>
<!-- Arm Gradient with depth shadow when moving back-to-front -->
<lineargradient id="armGrad" x1="20%" x2="80%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#FFFFFF"></stop>
<stop offset="85%" stop-color="#F2F3F8"></stop>
<stop offset="100%" stop-color="#E2E5F0"></stop>
</lineargradient>
<!-- Shadows -->
<filter height="120%" id="shadow" width="120%" x="-10%" y="-10%">
<fedropshadow dx="0" dy="6" flood-color="#D83000" flood-opacity="0.3" stddeviation="10"></fedropshadow>
</filter>
<filter height="130%" id="softShadow" width="130%" x="-15%" y="-15%">
<fedropshadow dx="-2" dy="5" flood-color="#2B2A2D" flood-opacity="0.16" stddeviation="6"></fedropshadow>
</filter>
<style>
      /* Vẫy từ sau ra trước (Beckoning wave: Back to Front):
         - Đung đưa góc vẫy từ sau ra trước (rotate nhẹ + skewY/scale)
         - Phóng nhẹ scale khi vươn về phía trước và thu nhẹ khi lùi ra sau
         - transform-origin neo tại gốc vai nối thân: 375px 365px
      */
      @keyframes waveBackToFront {
        0%, 100% {
          transform: rotate(0deg) scale(1) translateY(0);
        }
        30% {
          /* Vươn ra phía trước đón khách: tay hơi ngửa về trước, to hơn xíu (scale 1.05), hạ nhẹ góc */
          transform: rotate(-14deg) scale(1.06) translateY(-4px) skewX(2deg);
        }
        55% {
          /* Thu nhẹ ra sau */
          transform: rotate(4deg) scale(0.96) translateY(2px);
        }
        75% {
          /* Nhịp vẫy trước thứ 2 mạnh mẽ hơn */
          transform: rotate(-12deg) scale(1.04) translateY(-3px) skewX(1deg);
        }
      }

      .waving-arm-container {
        transform-origin: 375px 365px;
        animation: waveBackToFront 1.25s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }

      @keyframes waveGlow {
        0%, 100% { opacity: 0.2; transform: scale(0.9); }
        35% { opacity: 1; transform: scale(1.08); }
        60% { opacity: 0.3; transform: scale(0.95); }
      }

      .wave-pulse-1 {
        animation: waveGlow 1.25s ease-in-out infinite;
        transform-origin: 465px 230px;
      }
      .wave-pulse-2 {
        animation: waveGlow 1.25s ease-in-out infinite 0.15s;
        transform-origin: 478px 245px;
      }
    </style>
</defs>
<!-- 1. Background Container (Squircle) -->
<rect fill="url(#bgGrad)" height="512" rx="128" width="512"></rect>
<rect fill="none" height="480" rx="112" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6" width="480" x="16" y="16"></rect>
<!-- ========================================== -->
<!-- LAYER A: BODY & CHEST (Nằm phía sau đầu)  -->
<!-- ========================================== -->
<g filter="url(#shadow)" id="layer-body">
<!-- Thân nhỏ đẫy đà, vai mở rộng nâng đỡ cánh tay -->
<path d="M 148 358 C 125 400 132 468 175 482 C 215 492 295 492 335 482 C 382 468 390 400 365 358 Z" fill="url(#furGrad)"></path>
<!-- Bụng trắng xinh xắn -->
<ellipse cx="256" cy="436" fill="#FFFFFF" rx="66" ry="38"></ellipse>
<!-- Bàn chân trái ôm bụng -->
<ellipse cx="180" cy="425" fill="#FFFFFF" rx="22" ry="16" stroke="#FFE5D9" stroke-width="2" transform="rotate(-15 180 425)"></ellipse>
<circle cx="172" cy="420" fill="#FFAA80" r="3.5"></circle>
<circle cx="182" cy="418" fill="#FFAA80" r="3.5"></circle>
<circle cx="191" cy="422" fill="#FFAA80" r="3.5"></circle>
</g>
<!-- ========================================== -->
<!-- LAYER B: CÁNH TAY THẲNG & TO HƠN, VẪY TỪ SAU RA TRƯỚC -->
<!-- Nằm hoàn toàn phía sau Layer Đầu (#layer-head) -->
<!-- ========================================== -->
<g class="waving-arm-container" filter="url(#softShadow)" id="layer-waving-arm">
<!-- Cánh tay: Thẳng hơn, đầy đặn mập mạp hơn, nối sâu từ lồng ngực (335, 375) vươn lên cao cạnh má -->
<!-- Dáng tay mập mạp, thẳng khỏe khoắn mang phong cách Maneki-Neko chào khách -->
<path d="M 340 378 
             C 362 360 382 340 402 295 
             C 418 258 438 232 458 245 
             C 475 258 472 292 452 338 
             C 432 382 405 408 360 398 
             Z" fill="url(#armGrad)"></path>
<!-- Đệm lòng bàn chân mèo to tròn, đẫy đà hơn -->
<ellipse cx="442" cy="272" fill="#FFAA80" rx="16" ry="13" transform="rotate(-12 442 272)"></ellipse>
<!-- 4 ngón đệm thịt hồng kawaii (To hơn, tròn trịa rõ nét) -->
<circle cx="423" cy="250" fill="#FFAA80" r="6"></circle>
<circle cx="439" cy="242" fill="#FFAA80" r="6.5"></circle>
<circle cx="456" cy="248" fill="#FFAA80" r="6"></circle>
<!-- Sóng chào đón năng lượng / Chiêu tài may mắn -->
<path class="wave-pulse-1" d="M 474 232 Q 488 248 482 270" fill="none" stroke="#FFFFFF" stroke-dasharray="2 1" stroke-linecap="round" stroke-width="4.5"></path>
<path class="wave-pulse-2" d="M 488 242 Q 502 260 495 282" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="3.5"></path>
</g>
<!-- ========================================== -->
<!-- LAYER C: HEAD & FACE (Đè lên trước Layer Cánh Tay & Thân) -->
<!-- ========================================== -->
<g filter="url(#shadow)" id="layer-head">
<!-- Tai mèo trái -->
<polygon fill="#FFFFFF" points="110,210 150,90 230,160"></polygon>
<polygon fill="#FFAA80" points="125,195 158,120 210,168"></polygon>
<!-- Tai mèo phải -->
<polygon fill="#FFFFFF" points="380,210 340,90 260,160"></polygon>
<polygon fill="#FFAA80" points="365,195 332,120 280,168"></polygon>
<!-- Mũ Shipper Công Nghệ -->
<path d="M 120 185 Q 245 115 370 185 L 380 225 Q 245 170 110 225 Z" fill="#1C1B1F"></path>
<path d="M 108 220 Q 245 165 382 220 Q 405 248 372 252 Q 245 215 118 252 Q 88 248 108 220 Z" fill="url(#tealGrad)"></path>
<!-- Huy hiệu tia sét vàng trên mũ -->
<path d="M 252 160 L 234 192 L 248 192 L 236 218 L 264 185 L 250 185 Z" fill="#FFE500"></path>
<!-- Khuôn mặt mèo tròn bầu bĩnh che kín khớp tay bên dưới -->
<ellipse cx="245" cy="295" fill="#FFFFFF" rx="142" ry="122"></ellipse>
<!-- Má hồng ửng đào dễ thương -->
<ellipse cx="160" cy="315" fill="#FF8A73" opacity="0.65" rx="23" ry="15"></ellipse>
<ellipse cx="330" cy="315" fill="#FF8A73" opacity="0.65" rx="23" ry="15"></ellipse>
<!-- Đôi mắt to tròn long lanh có đốm sáng anime -->
<circle cx="188" cy="265" fill="#1F1F24" r="23"></circle>
<circle cx="181" cy="257" fill="#FFFFFF" r="8.5"></circle>
<circle cx="196" cy="273" fill="#FFFFFF" r="4.2"></circle>
<circle cx="302" cy="265" fill="#1F1F24" r="23"></circle>
<circle cx="295" cy="257" fill="#FFFFFF" r="8.5"></circle>
<circle cx="310" cy="273" fill="#FFFFFF" r="4.2"></circle>
<!-- Mũi tam giác & Khuôn miệng chúm chím hình chữ w -->
<polygon fill="#FF6B00" points="245,288 237,279 253,279"></polygon>
<path d="M 227 295 C 233 306 243 306 245 299 C 247 306 257 306 263 295" fill="none" stroke="#2B2A2D" stroke-linecap="round" stroke-width="4.5"></path>
<!-- Râu mèo 2 bên má thanh thoát -->
<line stroke="#FFD2C0" stroke-linecap="round" stroke-width="4" x1="135" x2="85" y1="280" y2="270"></line>
<line stroke="#FFD2C0" stroke-linecap="round" stroke-width="4" x1="137" x2="90" y1="298" y2="304"></line>
<line stroke="#FFD2C0" stroke-linecap="round" stroke-width="4" x1="355" x2="405" y1="280" y2="272"></line>
<line stroke="#FFD2C0" stroke-linecap="round" stroke-width="4" x1="353" x2="400" y1="298" y2="304"></line>
</g>
<!-- ========================================== -->
<!-- LAYER D: COLLAR & BELL (Vòng cổ nối đầu & thân) -->
<!-- ========================================== -->
<g filter="url(#shadow)" id="layer-collar">
<path d="M 180 392 Q 245 412 310 392 L 315 408 Q 245 430 175 408 Z" fill="url(#tealGrad)"></path>
<circle cx="245" cy="418" fill="#FFE500" r="18" stroke="#FFFFFF" stroke-width="3"></circle>
<path d="M 247 408 L 240 418 L 246 418 L 242 428 L 251 415 L 246 415 Z" fill="#FF5A00"></path>
</g>
</svg></div><!-- STITCH_SVG_END:ANIMATION_35 -->
</body>
</html>
