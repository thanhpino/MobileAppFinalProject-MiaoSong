<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF7A2F"/>
      <stop offset="100%" stop-color="#E54D0E"/>
    </linearGradient>
  </defs>
  <!-- Nền vuông bo góc cam MiaoSong -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>
  <!-- Tai mèo trắng + tai trong hồng -->
  <polygon points="15,28 18,12 28,22" fill="#FFFFFF"/>
  <polygon points="49,28 46,12 36,22" fill="#FFFFFF"/>
  <polygon points="18,24 20,16 25,22" fill="#FFB3BA"/>
  <polygon points="46,24 44,16 39,22" fill="#FFB3BA"/>
  <!-- Thân & đầu mèo thần tài trắng -->
  <ellipse cx="32" cy="48" rx="16" ry="11" fill="#FFFFFF"/>
  <ellipse cx="32" cy="31" rx="17" ry="14" fill="#FFFFFF"/>
  <!-- Tay vẫy dễ thương -->
  <ellipse cx="50" cy="40" rx="5.5" ry="7.5" transform="rotate(24 50 40)" fill="#FFFFFF"/>
  <!-- Mắt đen tròn -->
  <circle cx="25.5" cy="30" r="2.6" fill="#27180F"/>
  <circle cx="38.5" cy="30" r="2.6" fill="#27180F"/>
  <circle cx="24.7" cy="29.1" r="0.9" fill="#FFFFFF"/>
  <circle cx="37.7" cy="29.1" r="0.9" fill="#FFFFFF"/>
  <!-- Má hồng -->
  <ellipse cx="21" cy="34" rx="2.8" ry="1.8" fill="#FF9AA2" opacity="0.75"/>
  <ellipse cx="43" cy="34" rx="2.8" ry="1.8" fill="#FF9AA2" opacity="0.75"/>
  <!-- Mũi & miệng mèo -->
  <polygon points="32,33.5 30.2,31.8 33.8,31.8" fill="#FF6A1A"/>
  <path d="M29,35.5 Q32,38 35,35.5" fill="none" stroke="#27180F" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Vòng cổ đỏ & chuông vàng -->
  <rect x="20" y="42" width="24" height="4.2" rx="2.1" fill="#E53935"/>
  <circle cx="32" cy="46.5" r="3.8" fill="#FFC83D" stroke="#A43D00" stroke-width="1.2"/>
</svg>
